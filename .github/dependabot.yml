version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
    groups:
      # One PR per month bundling all minor + patch updates.
      # Major bumps still arrive individually, for review.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node majors track the newest Node release, not the Node this app
      # runs on. Types ahead of the runtime let code call APIs that do not exist
      # in production. Raise this by hand when the runtime moves (2026-10-08).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci:"
    groups:
      # One PR per month bundling all minor + patch updates.
      # Major bumps still arrive individually, for review.
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
